name: Security Audit

on:
  push:
    branches: ["main", "stage"]
  schedule:
    - cron: "0 0 * * 1" # Weekly on Mondays

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - name: Run npm audit
        run: npm audit
